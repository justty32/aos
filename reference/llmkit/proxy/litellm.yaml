# LiteLLM Proxy：DeepSeek 雲端、ChatGPT 訂閱（codex 後端）、Claude 訂閱（Claude Code 登入）、遠端 Ollama、本機 LM Studio。
# 連不到的來源不擋啟動，只有真的呼叫時才失敗。
# 啟動方式見 start_litellm.sh / start_litellm.ps1。

model_list:
  # DeepSeek 雲端 API
  # 2026-08-05 /models 只有 v4-flash / v4-pro；chat / reasoner 是仍可用的舊名。
  - model_name: deepseek-chat
    litellm_params: &ds
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info: &ds_info
      supports_function_calling: true
      supports_vision: false
      supports_reasoning: false
      supports_tool_choice: true
      supports_parallel_function_calling: true
      # litellm 內建資料庫說 true，但 2026-08-08 實打回 400。
      supports_response_schema: false
      supports_prompt_caching: true

  - model_name: deepseek-reasoner
    litellm_params:
      <<: *ds
      model: deepseek/deepseek-reasoner
    model_info: &ds_info_thinking
      <<: *ds_info
      supports_reasoning: true
      # 2026-08-09 實打：thinking mode 工具可用，但 tool_choice="required" 會 400。
      supports_tool_choice: false

  - model_name: deepseek-v4-pro
    litellm_params:
      <<: *ds
      model: deepseek/deepseek-v4-pro
    model_info: *ds_info_thinking

  # 遠端 Ollama（192.168.1.146:11434，不需要 api_key）
  # 本機模型 litellm 不認得，能力旗標要手填；一定用 ollama_chat/ 才走 /api/chat。
  # qwen3-32b / deepseek-r1-8b 才放行 reasoning_effort，避免誤傳給不支援思考的模型。
  - model_name: ollama-qwen3-32b
    litellm_params:
      model: ollama_chat/qwen3:32b
      api_base: &ol_base http://192.168.1.146:11434
      allowed_openai_params: ["reasoning_effort"]
    model_info: &ol_info
      supports_function_calling: true
      supports_vision: false
      supports_reasoning: true
      # 2026-08-10 實打：required 會被無聲忽略，但同一輪可以吐兩個 tool calls。
      supports_tool_choice: false
      supports_parallel_function_calling: true
      supports_response_schema: true
      supports_prompt_caching: false

  - model_name: ollama-qwen2.5-14b
    litellm_params:
      model: ollama_chat/qwen2.5:14b-instruct-q4_K_M
      api_base: *ol_base
    model_info:
      <<: *ol_info
      supports_reasoning: false

  - model_name: ollama-deepseek-r1-8b
    litellm_params:
      model: ollama_chat/deepseek-r1:8b
      api_base: *ol_base
      allowed_openai_params: ["reasoning_effort"]
    model_info:
      <<: *ol_info
      supports_function_calling: false
      supports_parallel_function_calling: false

  - model_name: ollama-gemma3-1b
    litellm_params:
      model: ollama_chat/gemma3:1b
      api_base: *ol_base
    model_info:
      <<: *ol_info
      supports_function_calling: false
      supports_parallel_function_calling: false
      supports_reasoning: false

  # 本機 LM Studio（http://localhost:1234/v1，OpenAI 相容，api_key 是佔位假值）
  # 測大模型前先 lms unload 其他模型；12B JIT 失敗時用 8192 context 手動載入。
  # -nothink 只是同模型焊死 reasoning_effort: none；allowlist 避免 drop_params 吞參數。
  - model_name: lm-gemma-4-12b
    litellm_params: &lm
      model: lm_studio/google/gemma-4-12b-qat
      api_base: http://localhost:1234/v1
      api_key: lm-studio-dummy-key
      allowed_openai_params: ["reasoning_effort", "top_k", "min_p", "repetition_penalty"]
    model_info: &lm_info
      supports_function_calling: true
      supports_vision: true
      supports_reasoning: true
      supports_tool_choice: true
      supports_parallel_function_calling: true
      supports_response_schema: true
      supports_prompt_caching: false     # usage.cached 一直是 None

  - model_name: lm-gemma-4-12b-nothink
    litellm_params:
      <<: *lm
      reasoning_effort: "none"
    model_info: &lm_info_nothink
      <<: *lm_info
      supports_reasoning: false

  - model_name: lm-gemma-4-e4b
    litellm_params:
      <<: *lm
      model: lm_studio/google/gemma-4-e4b
    model_info: *lm_info

  - model_name: lm-gemma-4-e4b-nothink
    litellm_params:
      <<: *lm
      model: lm_studio/google/gemma-4-e4b
      reasoning_effort: "none"
    model_info: *lm_info_nothink

  - model_name: lm-qwen3.5-9b
    litellm_params:
      <<: *lm
      model: lm_studio/qwen/qwen3.5-9b
    model_info: *lm_info

  - model_name: lm-qwen3.5-9b-nothink
    litellm_params:
      <<: *lm
      model: lm_studio/qwen/qwen3.5-9b
      reasoning_effort: "none"
    model_info: *lm_info_nothink

  # ChatGPT Pro 訂閱（litellm 內建 chatgpt provider，打 https://chatgpt.com/backend-api/codex/responses）
  # 不用 API key：讀 ~/.config/litellm/chatgpt/auth.json（CHATGPT_TOKEN_DIR / CHATGPT_AUTH_FILE 可改），
  # 用 ./chatgpt_auth_from_codex.py 從 codex CLI 登入過的 ~/.codex/auth.json 轉一份過來就不用再 device login。
  # model_info 裡 mode: responses 與 supports_native_streaming 兩個不是能力旗標，是開關：
  # - 沒有 mode: responses，litellm 會打不存在的 /chat/completions（回 HTML）；
  # - 沒有 supports_native_streaming，stream: true 會被 litellm 改成假串流，後端回 400 "Stream must be set to true"。
  # 模型清單抄 codex 的 ~/.codex/models_cache.json（2026-09-20：gpt-6-astra、gpt-5.6-sol/terra/luna、gpt-5.5）。
  # reasoning_effort 後端吃 low / medium / high / xhigh（astra/sol/terra 還有 max / ultra），沒有 none。
  - model_name: chatgpt-gpt-6-astra
    litellm_params: &cg
      model: chatgpt/gpt-6-astra
      allowed_openai_params: ["reasoning_effort"]
    model_info: &cg_info
      mode: responses
      supports_native_streaming: true
      supports_function_calling: true
      supports_vision: true
      supports_reasoning: true
      supports_tool_choice: true
      supports_parallel_function_calling: true
      # 2026-09-20 實打：response_format 送過去 200 但被無聲丟掉（回 markdown 不是 JSON）。
      supports_response_schema: false
      # 2026-09-20 實打：usage.prompt_tokens_details.cached_tokens 會有數字，但只命中 codex 固定
      # 前綴那 1408 tokens、而且時有時無；自己的長 system prompt 連打兩次沒命中過。
      supports_prompt_caching: true
      supports_none_reasoning_effort: false
      max_input_tokens: 272000
      max_output_tokens: 128000

  - model_name: chatgpt-gpt-6-astra-low
    litellm_params:
      <<: *cg
      reasoning_effort: "low"
    model_info: *cg_info

  - model_name: chatgpt-gpt-6-astra-high
    litellm_params:
      <<: *cg
      reasoning_effort: "high"
    model_info: *cg_info

  - model_name: chatgpt-gpt-5.6-sol
    litellm_params:
      <<: *cg
      model: chatgpt/gpt-5.6-sol
    model_info: *cg_info

  - model_name: chatgpt-gpt-5.6-terra
    litellm_params:
      <<: *cg
      model: chatgpt/gpt-5.6-terra
    model_info: *cg_info

  - model_name: chatgpt-gpt-5.6-luna
    litellm_params:
      <<: *cg
      model: chatgpt/gpt-5.6-luna
    model_info: *cg_info

  - model_name: chatgpt-gpt-5.5
    litellm_params:
      <<: *cg
      model: chatgpt/gpt-5.5
    model_info: *cg_info

  # Claude 訂閱（Claude Code 登入的 OAuth token，走 litellm 內建 anthropic/ provider 打 https://api.anthropic.com）
  # api_key 的 claude-code-login 是佔位值，不是真 key：claude_auth_from_claude_code.py（下面 callbacks 掛的）
  # 每個請求都會從 ~/.claude/.credentials.json 讀最新 accessToken 蓋掉它，順便在 messages 最前面插
  # 「You are Claude Code, Anthropic's official CLI for Claude.」這句 system（opus/sonnet 沒它就 429）。
  # 忘了掛 callback 就會 401 "invalid x-api-key"。
  # litellm 內建資料庫不認得 opus-5 / sonnet-5，旗標手填（2026-09-20 實打，見 README「Claude 訂閱」）。
  # opus-5 / sonnet-5 預設就會想（adaptive），但走 OAuth 拿不到思考內容、usage 的 reasoning_tokens 永遠 0；
  # supports_adaptive_thinking 讓 litellm 把 reasoning_effort 轉成 thinking: adaptive + output_config.effort
  # （low / medium / high / max），reasoning_effort: none 只是不送 thinking、後端照樣想，
  # 真的要關要送 thinking: {type: disabled}，所以 -nothink 分身焊的是這個。
  # -nothink 不能像 lm-* 那樣標 supports_reasoning: false：litellm 把 model_info 註冊在後端模型名
  # （anthropic/claude-opus-5）底下、同一顆的所有分身共用、最後一筆贏，標了 false 會讓 thinking /
  # reasoning_effort 變成「不支援參數」被 drop_params 吞掉，整組 opus-5 的 -low / -high / -nothink 一起失效
  # （2026-09-20 踩過）。反正 OAuth 路線思考內容拿不到，這個旗標對 client 只是情報，就全部維持 true。
  - model_name: claude-opus-5
    litellm_params: &cc
      model: anthropic/claude-opus-5
      api_key: claude-code-login
    model_info: &cc_info
      supports_function_calling: true
      supports_vision: true
      supports_reasoning: true
      supports_adaptive_thinking: true
      supports_tool_choice: true
      supports_parallel_function_calling: true
      supports_response_schema: true
      supports_prompt_caching: true
      max_input_tokens: 200000
      max_output_tokens: 64000

  - model_name: claude-opus-5-low
    litellm_params:
      <<: *cc
      reasoning_effort: "low"
    model_info: *cc_info

  - model_name: claude-opus-5-high
    litellm_params:
      <<: *cc
      reasoning_effort: "high"
    model_info: *cc_info

  - model_name: claude-opus-5-nothink
    litellm_params:
      <<: *cc
      thinking: {type: disabled}
    model_info: *cc_info

  - model_name: claude-sonnet-5
    litellm_params: &cc_sonnet
      <<: *cc
      model: anthropic/claude-sonnet-5
    model_info: *cc_info

  - model_name: claude-sonnet-5-low
    litellm_params:
      <<: *cc_sonnet
      reasoning_effort: "low"
    model_info: *cc_info

  - model_name: claude-sonnet-5-high
    litellm_params:
      <<: *cc_sonnet
      reasoning_effort: "high"
    model_info: *cc_info

  - model_name: claude-sonnet-5-nothink
    litellm_params:
      <<: *cc_sonnet
      thinking: {type: disabled}
    model_info: *cc_info

  # haiku 4.5 是舊式 thinking：預設不想；reasoning_effort low/medium/high 會變 thinking.budget_tokens
  # 1024/2048/4096，max_tokens 一定要比 budget 大不然 400。思考內容拿得到（reasoning_content）。
  - model_name: claude-haiku-4.5
    litellm_params:
      <<: *cc
      model: anthropic/claude-haiku-4-5-20251001
    model_info:
      <<: *cc_info
      supports_adaptive_thinking: false

# 要 master key 就設 LITELLM_MASTER_KEY 再解開。
# general_settings:
#   master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  # Claude 訂閱的 token 注入器（見 claude_auth_from_claude_code.py）；沒有 claude-* 條目時拿掉也無妨。
  callbacks: [claude_auth_from_claude_code.handler]
  # 不支援參數直接丟棄；要硬塞就用 allowed_openai_params。
  drop_params: true
  num_retries: 2
  request_timeout: 600
