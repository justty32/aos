<!doctype html>
<!-- 全景頁: single static page; all content is filled in by app.js from /api/*. -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全景</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div id="hdr" class="hdr"><h1>全景</h1><span class="mut">讀取中…</span></div>
  <div id="banner" class="banner" hidden></div>
  <nav id="views" class="views"><button type="button" data-v="list">清單</button><button type="button" data-v="map">地圖</button></nav>
</header>

<main>
  <section id="board-sec">
    <h2>📌 我的布告欄 <span class="mut">去睡覺、出門前留一句；agent 等不到你回信時會來看（aos-view board）</span></h2>
    <div id="board"></div>
  </section>

  <section id="asks-sec">
    <h2>🔵 要你決定 <span id="asks-count" class="mut"></span></h2>
    <div id="asks-flash"></div>
    <details id="answered" class="answered"><summary>📤 已送出的回答 <span id="answered-count" class="mut"></span></summary><div id="answered-list"></div></details>
    <div id="asks-empty" class="card mut" hidden>沒有在等你的信。</div>
    <div id="asks"></div>
  </section>

  <section id="map-sec">
    <div class="map-bar">
      <button type="button" id="map-fit">全覽</button>
      <button type="button" id="map-up" title="退一層（Esc）">← 上一層</button>
      <span id="map-crumbs" class="crumbs"></span>
      <span class="mut">滾輪縮放、拖曳移動、點房間飛進去、點員工看細節、Esc 退一層。🔵 數字＝有幾封在等你。</span>
    </div>
    <div id="map" class="map"><div id="map-world"></div><svg id="map-pins"></svg><div id="map-msg" class="mut"></div></div>
  </section>

  <section id="tree-sec">
    <h2>🏢 部門與員工</h2>
    <div class="legend mut">🔴 出事　🔵 等你　🟡 留意　🟢 正常　⚪ 停了。有出事或等你的部門會自動展開；你自己點開／收起的會記住。點名字看細節。</div>
    <div id="tree"></div>
  </section>

  <section id="machine-sec">
    <h2>⚙️ 機房</h2>
    <div id="machine"></div>
  </section>

  <section id="relay-sec">
    <h2>📮 隊伍回覆</h2>
    <div id="relay"></div>
  </section>
</main>

<aside id="panel" class="panel" hidden></aside>

<script src="app.js"></script>
<script src="map.js"></script>
</body>
</html>
